<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
:root{--night:#081416;--paper:#ece7da;--ink-2:#b4c0bb;--ink-3:#7f9592;--flag:#ff5c8a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--paper);font:400 18px/1.6 "Hanken Grotesk",system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:
  repeating-radial-gradient(circle at 72% 38%,transparent 0 22px,rgba(127,182,171,.14) 22px 23px),
  radial-gradient(90% 70% at 72% 38%,transparent,var(--night) 70%),var(--night);background-blend-mode:normal}
main{max-width:34rem}
p.k{margin:0 0 12px;font:italic 400 20px/1.2 "Poltawski Nowy",Georgia,serif;color:var(--flag)}
h1{margin:0;font:500 clamp(40px,7vw,72px)/1.02 "Poltawski Nowy",Georgia,serif;letter-spacing:-.01em}
p{color:var(--ink-2)}
a{display:inline-flex;align-items:center;height:48px;padding:0 22px;margin-top:10px;border-radius:999px;background:var(--paper);color:var(--night);text-decoration:none;font-weight:600}
a:focus-visible{outline:2px solid var(--flag);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="k">404</p>
  <h1>This page isn't on the map.</h1>
